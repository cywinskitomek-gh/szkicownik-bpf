<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Szkicownik BPF">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14161b">
<title>Szkicownik BPF</title>
<style>
/* Uklad: jedno pole rysunku na cala szerokosc, pod nim zwarta konsola parametrow jak w edytorze BPF */
:root{
  --bg:#f3f4f6; --panel:#ffffff; --ink:#1d2230; --muted:#667085; --line:#d5d9e2;
  --grid:#e3e6ec; --accent:#c8344e; --accent-ink:#ffffff; --curve:#c8344e; --ok:#1f7a4d;
  --sans:-apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono:ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14161b; --panel:#1c1f26; --ink:#ebe6dc; --muted:#9aa0ac; --line:#2e333d;
  --grid:#262a33; --accent:#e0566c; --accent-ink:#14161b; --curve:#ef6f83; --ok:#5fc48e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14161b; --panel:#1c1f26; --ink:#ebe6dc; --muted:#9aa0ac; --line:#2e333d;
  --grid:#262a33; --accent:#e0566c; --accent-ink:#14161b; --curve:#ef6f83; --ok:#5fc48e; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:1.15rem;margin:0;font-weight:600;letter-spacing:.01em;text-wrap:balance}
.hint{color:var(--muted);font-size:.85rem;margin:0}
.pad{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
canvas{display:block;width:100%;height:clamp(240px,calc(var(--vh,100svh) - 120px),640px);touch-action:none;cursor:crosshair}
.coord{position:absolute;top:8px;left:52px;font-family:var(--mono);font-size:.78rem;color:var(--ink);background:var(--panel);padding:2px 7px;border-radius:4px;pointer-events:none;font-variant-numeric:tabular-nums;border:1px solid var(--line)}
.badge{position:absolute;top:8px;right:10px;font-family:var(--mono);font-size:.72rem;color:var(--muted);
  background:var(--panel);padding:2px 6px;border-radius:4px;pointer-events:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 12px}
label{display:flex;flex-direction:column;gap:4px;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);min-width:0}
input,select{font:inherit;font-family:var(--mono);font-size:.9rem;color:var(--ink);background:var(--panel);
  border:1px solid var(--line);border-radius:6px;padding:7px 8px;min-width:0;width:100%;box-sizing:border-box;text-transform:none;letter-spacing:0}
input[type=range]{padding:0;border:none;background:transparent;accent-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;font-weight:600;font-size:.9rem;border-radius:7px;padding:9px 14px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
.status{font-size:.85rem;color:var(--ok);min-height:1.2em;margin:0}
.status.err{color:var(--accent)}
textarea{width:100%;box-sizing:border-box;font-family:var(--mono);font-size:.78rem;color:var(--ink);background:var(--panel);
  border:1px solid var(--line);border-radius:6px;padding:8px;height:88px;resize:vertical}
section h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:6px 0 8px;font-weight:600}
.saved{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.saved li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-top:1px solid var(--line);min-width:0}
.saved li:first-child{border-top:none}
.saved .nm{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saved .meta{font-family:var(--mono);font-size:.72rem;color:var(--muted);white-space:nowrap}
.saved button{padding:5px 10px;font-size:.8rem}
.empty{color:var(--muted);font-size:.85rem;padding:10px;border:1px dashed var(--line);border-radius:8px;margin:0}
/* telefon w poziomie: bez tytulu, plotno na prawie cala wysokosc ekranu */
@media (max-height: 500px){
  body{padding-block:6px 24px}
  header{display:none}
  canvas{height:max(200px,calc(var(--vh,100svh) - 40px))}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head><body>

<div class="wrap">
  <header>
    <h1>Szkicownik BPF</h1>
  </header>

  <div class="pad">
    <canvas id="cv" aria-label="Pole rysowania krzywej"></canvas>
    <span class="badge" id="badge">przykład</span>
    <span class="coord" id="coord" hidden></span>
  </div>

  <div class="grid">
    <label for="nm">Nazwa<input id="nm" value="center" autocomplete="off"></label>
    <label for="preset">Zakres y
      <select id="preset">
        <option value="mc">midicenty 2100–10800</option>
        <option value="tension">tension 113–244</option>
        <option value="unit">0 … 1</option>
        <option value="bi">−1 … 1</option>
        <option value="sigma">sigma 0–2400</option>
        <option value="own">własny</option>
      </select>
    </label>
    <label for="ymin">y min<input id="ymin" type="number" step="any" value="2100"></label>
    <label for="ymax">y max<input id="ymax" type="number" step="any" value="10800"></label>
    <label for="xmode">Oś x<select id="xmode"><option value="idx">numer punktu 0…N−1</option><option value="own">własny zakres</option></select></label>
    <label for="xmin">x min<input id="xmin" type="number" step="any" value="0" disabled></label>
    <label for="xmax">x max<input id="xmax" type="number" step="any" value="127" disabled></label>
    <label for="npts">Punkty<input id="npts" type="number" min="2" max="2000" step="1" value="128"></label>
    <label for="dec">Precyzja<input id="dec" type="number" min="-3" max="10" step="1" value="0"></label>
    <label for="smooth">Wygładzenie <span id="smv">2</span><input id="smooth" type="range" min="0" max="12" step="1" value="2"></label>
  </div>

  <div class="row">
    <button class="primary" id="copy">Kopiuj dla OM</button>
    <button id="file">Zapisz plik .txt</button>
    <button id="clear">Wyczyść</button>
  </div>
  <p class="status" id="status" role="status"></p>

  <label for="out">Tekst dla OM (pudełko bpf-from-text) – wartości y można poprawiać<textarea id="out" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea></label>
  <div class="row"><p class="status err" id="terr" role="alert" hidden></p><button id="restore" hidden>Przywróć</button></div>

</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $("cv"), ctx = cv.getContext("2d");
  const presets = {mc:[2100,10800,0], tension:[113,244,0], unit:[0,1,3], bi:[-1,1,3], sigma:[0,2400,0]};
  let N = 128, ys = new Array(N).fill(NaN), example = true, last = null, db = null, editing = false, bad = false;

  // przyklad: lagodny luk, zeby pierwszy widok pokazywal dzialanie
  for (let i = 0; i < N; i++) ys[i] = 6000 + 1800 * Math.sin(i / (N - 1) * Math.PI) - 600 * Math.sin(i / (N - 1) * 3 * Math.PI);

  const num = id => parseFloat($(id).value);
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

  function filled() {
    const out = ys.slice(); const idx = [];
    out.forEach((v, i) => { if (!isNaN(v)) idx.push(i); });
    if (!idx.length) return null;
    for (let i = 0; i < idx[0]; i++) out[i] = out[idx[0]];
    for (let i = idx[idx.length - 1] + 1; i < N; i++) out[i] = out[idx[idx.length - 1]];
    for (let k = 0; k < idx.length - 1; k++) {
      const a = idx[k], b = idx[k + 1];
      for (let i = a + 1; i < b; i++) out[i] = out[a] + (out[b] - out[a]) * (i - a) / (b - a);
    }
    return out;
  }
  function smoothed(arr) {
    const r = parseInt($("smooth").value, 10) || 0;
    if (!r) return arr;
    return arr.map((_, i) => {
      let s = 0, c = 0;
      for (let j = Math.max(0, i - r); j <= Math.min(N - 1, i + r); j++) { s += arr[j]; c++; }
      return s / c;
    });
  }
  function result() {
    const f = filled(); if (!f) return null;
    const lo = num("ymin"), hi = num("ymax"), dec = getDec();
    const x0 = num("xmin"), x1 = num("xmax");
    const y = smoothed(f).map(v => roundY(v, dec, lo, hi));
    const xd = Math.max(dec, 3, 0);
    const x = y.map((_, i) => Number((x0 + (x1 - x0) * i / (N - 1)).toFixed(xd)));
    return {x, y, dec};
  }
  function text(res) {
    const name = ($("nm").value || "krzywa").replace(/[\r\n]/g, " ");
    return `;; bpf-pad: ${name}  (precyzja ${Math.max(0, res.dec)})\n(${res.x.join(" ")})\n(${res.y.join(" ")})\n`;
  }
  // precyzja: ujemna = zaokraglenie do 10, 100, 1000; krok najwyzej 1/4 zakresu y
  function minDec() {
    const range = Math.abs(num("ymax") - num("ymin"));
    if (!(range > 0)) return 0;
    return Math.max(-3, Math.min(0, -Math.floor(Math.log10(range / 4))));
  }
  function getDec() {
    const el = $("dec"), m = minDec(); el.min = m;
    let d = parseInt(el.value, 10); if (isNaN(d)) d = 0;
    const c = Math.max(m, Math.min(10, d)); if (c !== d) el.value = c;
    return c;
  }
  function roundY(v, dec, lo, hi) {
    const a = Math.min(lo, hi), b = Math.max(lo, hi);
    v = Math.max(a, Math.min(b, v));
    if (dec >= 0) return Number(v.toFixed(dec));
    const s = Math.pow(10, -dec), r = Math.round(v / s) * s;
    return Math.max(Math.ceil(a / s) * s, Math.min(Math.floor(b / s) * s, r));
  }
  // podzialka y na okraglych wartosciach (1, 2, 5 x 10^k)
  function ticks(lo, hi) {
    const a = Math.min(lo, hi), b = Math.max(lo, hi), span = b - a;
    if (!(span > 0)) return {vals: [a], d: 0};
    const raw = span / 8, p = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 5, 10].map(m => m * p).find(s => s >= raw) || 10 * p;
    const vals = []; for (let v = Math.ceil(a / step) * step; v <= b + step * 1e-9; v += step) vals.push(v);
    return {vals, d: Math.max(0, -Math.floor(Math.log10(step) + 1e-9))};
  }

  // wysokosc faktycznie widocznego obszaru (bez paskow przegladarki)
  function setVh() {
    const h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    document.documentElement.style.setProperty("--vh", Math.round(h) + "px");
  }
  function size() {
    setVh();
    const d = window.devicePixelRatio || 1;
    cv.width = Math.round(cv.clientWidth * d); cv.height = Math.round(cv.clientHeight * d);
    ctx.setTransform(d, 0, 0, d, 0, 0); draw();
  }
  const L = 46, R = 10, T = 12, B = 22; // marginesy pola (osie)
  function geom() { return {w: cv.clientWidth - L - R, h: cv.clientHeight - T - B}; }
  // polozenie palca wzgledem samego plotna (odporne na skalowanie widoku przez przegladarke)
  function pt(e) {
    const r = cv.getBoundingClientRect();
    return {x: (e.clientX - r.left) * cv.clientWidth / r.width, y: (e.clientY - r.top) * cv.clientHeight / r.height};
  }

  function draw() {
    const g = geom();
    ctx.clearRect(0, 0, cv.clientWidth, cv.clientHeight);
    const lo = num("ymin"), hi = num("ymax");
    ctx.font = "11px " + css("--mono"); ctx.fillStyle = css("--muted"); ctx.strokeStyle = css("--grid"); ctx.lineWidth = 1;
    const tk = ticks(lo, hi);
    tk.vals.forEach(v => {
      const yy = T + g.h * (hi - v) / (hi - lo);
      ctx.beginPath(); ctx.moveTo(L, yy); ctx.lineTo(L + g.w, yy); ctx.stroke();
      ctx.textAlign = "right"; ctx.textBaseline = "middle";
      ctx.fillText(v.toFixed(tk.d), L - 6, yy);
    });
    for (let k = 0; k <= 8; k++) {
      const xx = L + g.w * k / 8;
      ctx.beginPath(); ctx.moveTo(xx, T); ctx.lineTo(xx, T + g.h); ctx.stroke();
    }
    const x0 = num("xmin"), x1 = num("xmax");
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic"; ctx.fillText(String(x0), L, T + g.h + 16);
    ctx.textAlign = "right"; ctx.fillText(String(x1), L + g.w, T + g.h + 16);
    const res = result();
    if (res) {
      ctx.strokeStyle = css("--curve"); ctx.lineWidth = 2.2; ctx.lineJoin = "round"; ctx.beginPath();
      res.y.forEach((v, i) => {
        const px = L + g.w * i / (N - 1), py = T + g.h * (hi - v) / (hi - lo);
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      });
      ctx.stroke();
      if (N <= 64) { ctx.fillStyle = css("--curve");
        res.y.forEach((v, i) => { ctx.beginPath(); ctx.arc(L + g.w * i / (N - 1), T + g.h * (hi - v) / (hi - lo), 2.4, 0, 7); ctx.fill(); }); }
      if (!editing) $("out").value = text(res);
    } else if (!editing) $("out").value = "";
    $("badge").hidden = !example;
    $("badge").textContent = "przykład";
  }

  function at(e) {
    const g = geom(), p = pt(e);
    const fx = (p.x - L) / g.w, fy = (p.y - T) / g.h;
    const lo = num("ymin"), hi = num("ymax");
    return {i: Math.max(0, Math.min(N - 1, Math.round(fx * (N - 1)))), v: hi - Math.max(0, Math.min(1, fy)) * (hi - lo)};
  }
  function put(p) {
    if (last && last.i !== p.i) {
      const a = last, s = Math.sign(p.i - a.i);
      for (let i = a.i + s; i !== p.i; i += s) ys[i] = a.v + (p.v - a.v) * (i - a.i) / (p.i - a.i);
    }
    ys[p.i] = p.v; last = p;
  }
  cv.addEventListener("pointerdown", e => {
    if (example) { ys = new Array(N).fill(NaN); example = false; }
    cv.setPointerCapture(e.pointerId); last = null; put(at(e)); draw(); showCoord(e); e.preventDefault();
  });
  function showCoord(e) {
    const g = geom(), p = pt(e);
    const fx = Math.max(0, Math.min(1, (p.x - L) / g.w)), fy = Math.max(0, Math.min(1, (p.y - T) / g.h));
    const x0 = num("xmin"), x1 = num("xmax"), lo = num("ymin"), hi = num("ymax");
    const dec = getDec();
    const xd = $("xmode").value === "idx" ? 0 : (Math.abs(x1 - x0) <= 20 ? 2 : 1);
    const c = $("coord"); c.hidden = false;
    c.textContent = "x " + ($("xmode").value === "idx" ? String(Math.round(fx * (N - 1))) : (x0 + (x1 - x0) * fx).toFixed(xd)) + "   y " + roundY(hi - (hi - lo) * fy, dec, lo, hi).toFixed(Math.max(0, dec));
  }
  cv.addEventListener("pointerleave", () => { $("coord").hidden = true; });
  cv.addEventListener("pointermove", e => {
    showCoord(e);
    if (!cv.hasPointerCapture(e.pointerId)) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    evs.forEach(ev => put(at(ev))); draw();
  });
  const end = () => { last = null; };
  cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);

  function resample(n) {
    const f = filled() || new Array(N).fill(NaN);
    const out = new Array(n);
    for (let i = 0; i < n; i++) {
      const u = i / (n - 1) * (N - 1), a = Math.floor(u), b = Math.min(N - 1, a + 1);
      out[i] = isNaN(f[a]) ? NaN : f[a] + (f[b] - f[a]) * (u - a);
    }
    N = n; ys = out;
  }

  $("preset").addEventListener("change", () => {
    const p = presets[$("preset").value]; if (!p) return;
    const [oldLo, oldHi] = [num("ymin"), num("ymax")];
    $("ymin").value = p[0]; $("ymax").value = p[1]; $("dec").value = p[2];
    ys = ys.map(v => isNaN(v) ? v : p[0] + (v - oldLo) / (oldHi - oldLo) * (p[1] - p[0]));
    draw();
  });
  ["ymin", "ymax"].forEach(id => $(id).addEventListener("input", () => { $("preset").value = "own"; draw(); }));
  ["xmin", "xmax", "dec"].forEach(id => $(id).addEventListener("input", draw));
  $("smooth").addEventListener("input", () => { $("smv").textContent = $("smooth").value; draw(); });
  function syncX() {
    const idx = $("xmode").value === "idx";
    $("xmin").disabled = idx; $("xmax").disabled = idx;
    if (idx) { $("xmin").value = 0; $("xmax").value = N - 1; }
  }
  $("xmode").addEventListener("change", () => { syncX(); draw(); });
  $("npts").addEventListener("change", () => {
    const n = Math.max(2, Math.min(2000, parseInt($("npts").value, 10) || 128));
    $("npts").value = n; resample(n); syncX(); draw();
  });
  $("clear").addEventListener("click", () => { ys = new Array(N).fill(NaN); example = false; draw(); say("Wyczyszczono."); });

  // edycja tekstu: tylko wartosci y; x, liczba punktow i zakres sa pilnowane
  function textError(msg) {
    bad = true; $("terr").textContent = msg; $("terr").hidden = false; $("restore").hidden = false;
    $("copy").disabled = true; $("file").disabled = true;
  }
  function textOk() {
    bad = false; $("terr").hidden = true; $("restore").hidden = true;
    $("copy").disabled = false; $("file").disabled = false;
  }
  function checkText() {
    const res = result(); if (!res) return;
    const lists = [...$("out").value.replace(/;[^\n]*/g, "").matchAll(/\(([^()]*)\)/g)].map(m => m[1].trim().split(/\s+/).filter(Boolean));
    if (lists.length !== 2) return textError("Tekst musi mieć dwie listy w nawiasach: x i y.");
    const [xs, yv] = lists;
    if (xs.length !== N || yv.length !== N) return textError(`Każda lista musi mieć ${N} wartości (x: ${xs.length}, y: ${yv.length}).`);
    for (let i = 0; i < N; i++) if (Number(xs[i]) !== res.x[i]) return textError(`x w punkcie ${i} zmieniony – x zmieniasz polami „Oś x” i „Punkty”.`);
    const lo = Math.min(num("ymin"), num("ymax")), hi = Math.max(num("ymin"), num("ymax")), out = [];
    for (let i = 0; i < N; i++) {
      const v = Number(yv[i].replace(",", "."));
      if (!isFinite(v)) return textError(`y w punkcie ${i} to nie liczba: „${yv[i]}”.`);
      if (v < lo || v > hi) return textError(`y w punkcie ${i} (${v}) poza zakresem ${lo}–${hi}.`);
      out.push(v);
    }
    textOk();
    ys = out; example = false;
    if (parseInt($("smooth").value, 10)) { $("smooth").value = 0; $("smv").textContent = "0"; say("Wygładzenie wyłączone, żeby nie zmieniało wpisanych wartości."); }
    draw();
  }
  $("out").addEventListener("focus", () => { editing = true; });
  $("out").addEventListener("input", checkText);
  $("out").addEventListener("blur", () => { editing = false; if (!bad) draw(); });
  $("restore").addEventListener("click", () => { editing = false; textOk(); draw(); say("Przywrócono ostatnią poprawną wersję."); });

  function say(t, err) { const s = $("status"); s.textContent = t; s.classList.toggle("err", !!err); }

  $("copy").addEventListener("click", () => {
    const res = result(); const t = res && !bad ? text(res) : ""; if (!t) { say("Najpierw narysuj krzywą.", true); return; }
    const sel = () => { $("out").focus(); $("out").select(); say("Zaznaczono tekst — skopiuj go ręcznie (Kopiuj)."); };
    try {
      navigator.clipboard.writeText(t).then(() => say("Skopiowano. Na Macu wklej do pudełka text-box i podłącz do bpf-from-text."), sel);
    } catch (e) { sel(); }
  });

  const slug = s => (s || "krzywa").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ł/g, "l")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60) || "krzywa";

  function settings() {
    return {xmode: $("xmode").value, xmin: num("xmin"), xmax: num("xmax"), ymin: num("ymin"), ymax: num("ymax"),
            dec: parseInt($("dec").value, 10) || 0, smooth: parseInt($("smooth").value, 10) || 0, preset: $("preset").value};
  }

  function load(v) {
    const s = v.settings || {};
    ["xmin", "xmax", "ymin", "ymax", "dec", "smooth"].forEach(k => { if (s[k] !== undefined) $(k).value = s[k]; });
    $("xmode").value = s.xmode || "own";
    $("smv").textContent = $("smooth").value; $("preset").value = s.preset || "own"; $("nm").value = v.name || "";
    const raw = Array.isArray(v.raw) && v.raw.length ? v.raw : (v.y || []);
    N = raw.length || 128; $("npts").value = N; ys = raw.map(Number); example = false; syncX(); draw();
  }

  // zapis pliku: na iPhonie arkusz udostepniania (Zachowaj w Plikach), na Macu zwykle pobieranie
  $("file").addEventListener("click", async () => {
    const res = result(); const t = res && !bad ? text(res) : ""; if (!t) { say("Najpierw narysuj krzywą.", true); return; }
    const name = slug($("nm").value) + ".bpf.txt";
    const file = new File([t], name, {type: "text/plain"});
    try {
      if (navigator.canShare && navigator.canShare({files: [file]})) {
        await navigator.share({files: [file]}); say("Gotowe. Na iPhonie wybierz „Zachowaj w Plikach” → iCloud Drive."); return;
      }
    } catch (e) { if (e && e.name === "AbortError") return; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name;
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    say("Zapisano " + name + ".");
  });

  // ostatnia krzywa zostaje w przegladarce
  const keep = () => { try { const f = filled(); if (f) localStorage.setItem("bpf-pad", JSON.stringify({name: $("nm").value, raw: f, settings: settings()})); } catch (e) {} };
  cv.addEventListener("pointerup", keep); document.addEventListener("change", keep);

  window.addEventListener("resize", size);
  window.addEventListener("orientationchange", () => setTimeout(size, 250));
  if (window.visualViewport) window.visualViewport.addEventListener("resize", size);
  if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", draw);
  new MutationObserver(draw).observe(document.documentElement, {attributes: true, attributeFilter: ["data-theme"]});
  size();
  try { const d = JSON.parse(localStorage.getItem("bpf-pad") || "null"); if (d && d.raw) load(d); } catch (e) {}
})();
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});</script>
